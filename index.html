<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>One Special Question ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Floating Hearts -->

    <div class="hearts">

        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
        <span>💘</span>
        <span>💓</span>
        <span>❤️</span>
        <span>💕</span>

    </div>
    
    <!-- Opening Screen -->

<section class="intro-screen" id="introScreen">

    <div class="envelope">
        💌
    </div>

    <p class="small-title">
        YOU HAVE A SPECIAL MESSAGE
    </p>

    <h1>
        Someone has a question for you... 👀
    </h1>

    <p class="intro-text">
        But first, tell me your name ❤️
    </p>
    
    <p class="made-by">
    Made especially for you ❤️
    </p>

    <p class="made-by">
    — Aman
    </p>

    <input
        type="text"
        id="nameInput"
        placeholder="Enter your name..."
        maxlength="25"
    >

    <button id="openBtn">
        Open it ❤️
    </button>

</section>

    <!-- Main -->

    <main class="container">

        <div class="card" id="mainCard">

            <div class="emoji">
                💌
            </div>

            <p class="small-title">
                A LITTLE QUESTION FOR YOU
            </p>

            <h1 id="personalGreeting">
                Hey Beautiful! ❤️
            </h1>

            <p class="question">
                Will you go on a date with me? 🥰
            </p>

            <p class="subtext">
                Think carefully... 😉
            </p>


            <div class="buttons">

                <button id="yesBtn">
                    Yes ❤️
                </button>

                <button id="noBtn">
                    No 😜
                </button>

            </div>


            <p id="hint">
                Choose wisely... 👀
            </p>

        </div>

    </main>


    <!-- Celebration -->

    <canvas id="confetti"></canvas>


    <script src="script.js"></script>

</body>

</html>
